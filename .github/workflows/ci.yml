name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The sqlite3 CLI is what dbSync.test.ts actually exercises (its
      # json_object() 63-pair limit); without it that test skips itself.
      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Type-check server
        run: npm run build:server

      - name: Build client
        run: npm run build

      - name: Lint client
        run: npm run lint

      - name: Server tests
        run: npm test
