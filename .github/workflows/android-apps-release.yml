name: Android Apps Release (Staff + PANORTH)

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apps-release.yml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/panorth-android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apps-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            ls -la "$ANDROID_HOME/cmdline-tools" 2>&1 || true
            exit 1
          fi
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Set PANORTH version from run number
        run: |
          VC=${{ github.run_number }}
          GRADLE=client/android-panorth/app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VC/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$VC\"/" "$GRADLE"

      - name: Build MT-Billing staff APK
        run: |
          npm run android:sync
          cd client/android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../mt-billing-debug.apk

      - name: Build PANORTH subscriber APK
        run: |
          npm run android:sync:panorth
          cd client/android-panorth && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../panorth-debug.apk

      - name: Write PANORTH version manifest
        run: |
          VC=${{ github.run_number }}
          cat > panorth-version.json <<EOF
          {
            "applicationId": "com.tsogs.panorth",
            "versionCode": $VC,
            "versionName": "1.0.$VC",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/android-apps-v${{ github.run_number }}/panorth-debug.apk"
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apps-bundle
          path: |
            mt-billing-debug.apk
            panorth-debug.apk
            panorth-version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish combined android-apps-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apps-latest
          name: MT-Billing Android Apps (Staff + PANORTH subscriber)
          body: |
            Built from `main` at commit `${{ github.sha }}`.

            | APK | App | Package |
            |-----|-----|---------|
            | **mt-billing-debug.apk** | MT-Billing (staff panel) | `com.tsogs.mtbilling` |
            | **panorth-debug.apk** | PANORTH (subscriber portal) | `com.tsogs.panorth` |

            **Series build ${{ github.run_number }}** — immutable tag `android-apps-v${{ github.run_number }}` (version **1.0.${{ github.run_number }}**).

            PANORTH: set Subscriber Portal → **Published version code** to `${{ github.run_number }}` and **APK URL** to:
            `https://github.com/${{ github.repository }}/releases/download/android-apps-v${{ github.run_number }}/panorth-debug.apk`
            (or `android-apps-latest` for rolling latest).

            Debug builds (not Play Store signed). Allow install from unknown sources when sideloading.
          files: |
            mt-billing-debug.apk
            panorth-debug.apk
            panorth-version.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish numbered android-apps-v${{ github.run_number }} (immutable series)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apps-v${{ github.run_number }}
          name: MT-Billing Android Apps v${{ github.run_number }} (1.0.${{ github.run_number }})
          body: |
            Immutable **series release #${{ github.run_number }}** from commit `${{ github.sha }}`.

            | Download | App |
            |----------|-----|
            | mt-billing-debug.apk | Staff panel |
            | panorth-debug.apk | PANORTH subscriber portal |
            | panorth-version.json | Version manifest (versionCode **${{ github.run_number }}**) |

            Rolling latest: `android-apps-latest`.
          files: |
            mt-billing-debug.apk
            panorth-debug.apk
            panorth-version.json
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling android-latest (staff only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MT-Billing Android (auto-built debug APK)
          files: mt-billing-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish numbered android-v${{ github.run_number }} (staff series)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: MT-Billing Android staff v${{ github.run_number }}
          files: mt-billing-debug.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling portal-android-latest (PANORTH only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-android-latest
          name: PANORTH Android (subscriber portal APK)
          files: |
            panorth-debug.apk
            panorth-version.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish numbered portal-android-v${{ github.run_number }} (PANORTH series)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-android-v${{ github.run_number }}
          name: PANORTH Android v${{ github.run_number }} (1.0.${{ github.run_number }})
          files: |
            panorth-debug.apk
            panorth-version.json
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
