<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none" role="img" aria-label="QRPh">
  <!-- Official QRPh national QR branding (BSP / PPMI style) -->
  <rect width="220" height="64" rx="0" fill="#FFFFFF"/>
  <!-- Mark: blue top-left + red bottom-right brackets, yellow center -->
  <g transform="translate(8,8)">
    <!-- Blue outer L -->
    <path fill="#0033A0" d="M0 0h22v7H7v15H0V0z"/>
    <!-- Blue inner square (finder eye) -->
    <rect x="9.5" y="9.5" width="6" height="6" fill="#0033A0"/>
    <!-- Red outer L -->
    <path fill="#CE1126" d="M48 48H26v-7h15V26h7v22z"/>
    <!-- Red inner square -->
    <rect x="32.5" y="32.5" width="6" height="6" fill="#CE1126"/>
    <!-- Yellow center -->
    <circle cx="24" cy="24" r="8.5" fill="#FCD116"/>
  </g>
  <!-- Wordmark: QR (red) + Ph (blue) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="36">
    <text x="72" y="45" fill="#CE1126" letter-spacing="-1">QR</text>
    <text x="128" y="45" fill="#0033A0" letter-spacing="-1">Ph</text>
  </g>
</svg>
