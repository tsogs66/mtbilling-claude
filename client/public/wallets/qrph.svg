  <!-- Mini QR mark -->
  <g fill="#fff" transform="translate(8,7)">
    <rect x="0" y="0" width="9" height="9" rx="1.2"/>
    <rect x="2.2" y="2.2" width="4.6" height="4.6" fill="#1B4F9C"/>
    <rect x="3.4" y="3.4" width="2.2" height="2.2" fill="#fff"/>
    <rect x="13" y="0" width="9" height="9" rx="1.2"/>
    <rect x="15.2" y="2.2" width="4.6" height="4.6" fill="#1B4F9C"/>
    <rect x="16.4" y="3.4" width="2.2" height="2.2" fill="#fff"/>
    <rect x="0" y="13" width="9" height="9" rx="1.2"/>
    <rect x="2.2" y="15.2" width="4.6" height="4.6" fill="#1B4F9C"/>
    <rect x="3.4" y="16.4" width="2.2" height="2.2" fill="#fff"/>
    <rect x="12" y="12" width="3" height="3" rx="0.4"/>
    <rect x="16.5" y="12" width="3" height="3" rx="0.4"/>
    <rect x="12" y="16.5" width="3" height="3" rx="0.4"/>
    <rect x="19" y="16.5" width="3" height="5.5" rx="0.4"/>
    <rect x="12" y="20.5" width="5.5" height="1.5" rx="0.3"/>
  </g>
  <text x="72" y="23.5" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" letter-spacing="0.02em">QR Ph</text>
</svg>
