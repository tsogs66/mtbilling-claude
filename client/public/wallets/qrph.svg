<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="QRPh">
  <!-- Official QRPh mark: blue/red finder brackets, yellow center, QR (red) + Ph (blue) -->
  <g transform="translate(2,4)">
    <!-- Blue L (top-left) -->
    <path fill="#0033A0" d="M0 0h20v6.5H6.5V20H0V0z"/>
    <!-- Red L (bottom-right) -->
    <path fill="#CE1126" d="M48 48H28v-6.5h13.5V28H48v20z"/>
    <!-- Yellow center disc -->
    <circle cx="24" cy="24" r="9" fill="#FCD116"/>
  </g>
  <text
    x="62"
    y="39"
    font-family="Arial, Helvetica, system-ui, sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="-0.04em"
  >
    <tspan fill="#CE1126">QR</tspan><tspan fill="#0033A0">Ph</tspan>
  </text>
</svg>
